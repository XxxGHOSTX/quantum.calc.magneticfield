name: Quantum Calculator Web Security

on:
  push:
    branches:
      - security/local-webapp-and-input-bounds-2026-11-02
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: quantum-web-security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
      - name: Compile app and tests
        run: python -m compileall -q web_app.py tests
      - name: Run local API security tests
        run: python -m unittest discover -s tests -p 'test_web_security.py' -v
